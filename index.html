        .attr('fill', isPrimary ? D.primaryPassive : D.compPassive)
        .attr('data-brand', d.name)
        .transition().duration(600).delay(delay).ease(d3.easeCubicOut)
        .attr('height', yActive);

      // active (bottom portion)
      g.append('rect').attr('x', bx).attr('y', iH).attr('width', bw)
        .attr('height', 0).attr('rx', 0)
        .attr('fill', isPrimary ? D.primaryActive : D.compActive)
        .attr('data-brand', d.name).style('cursor','pointer')
        .transition().duration(600).delay(delay).ease(d3.easeCubicOut)
        .attr('y', yActive).attr('height', iH - yActive);

      // separator
      g.append('line').attr('x1', bx).attr('x2', bx + bw).attr('y1', yActive).attr('y2', yActive)
        .attr('stroke','#1A1A1A').attr('stroke-width', 2).attr('pointer-events','none');
    });

    // x-axis brand labels
    g.append('g').attr('transform', 'translate(0,' + iH + ')')
      .call(d3.axisBottom(band).tickSize(0).tickPadding(6))
      .call(ax => ax.select('.domain').remove())
      .selectAll('text')
      .style('fill', d => d === primary ? D.primaryActive : '#E6E6E6')
      .style('font-size','9px').style('font-family', FONT_LIGHT)
      .style('text-transform','uppercase');

    el.appendChild(svgEl);
  }

  // ─── SCALE · FIGMA ────────────────────────────────────────────────────────
  function renderScaleFigma(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const scoreW = 52, trackW = W - scoreW;
    const trackH = H < 220 ? 24 : 34;
    const barH   = H < 220 ? 18 : 28;
    const rowGap = 5;

    const sorted = [
      ...data.filter(d => d.name === primary),
      ...[...data.filter(d => d.name !== primary)].sort((a,b) => b.value - a.value),
    ];

    const domain = [d3.min(data, d => d.value) * 0.95, d3.max(data, d => d.value) * 1.05];
    const xScale = d3.scaleLinear().domain(domain).range([0, trackW]);

    el.style.padding = '8px 0';
    el.style.overflowY = 'auto';

    sorted.forEach((d, i) => {
      const isPrimary = d.name === primary;
      const col = isPrimary ? D.primary : D.comp;

      const row = document.createElement('div');
      row.style.cssText = 'margin-bottom:' + rowGap + 'px;';

      // separator below primary
      if (isPrimary && i < sorted.length - 1) {
        row.style.borderBottom = '0.5px solid var(--grey-700)';
        row.style.paddingBottom = rowGap + 'px';
        row.style.marginBottom = rowGap + 'px';
      }

      // brand name label
      const lbl = document.createElement('div');
      lbl.style.cssText = 'font-family:' + FONT_LIGHT + ';font-size:' +
        (isPrimary ? '8.5' : '8') + 'px;text-transform:uppercase;letter-spacing:0.10em;' +
        'color:' + col + ';margin-bottom:3px;';
      lbl.textContent = d.name;
      row.appendChild(lbl);

      // track + score row
      const flex = document.createElement('div');
      flex.style.cssText = 'display:flex;align-items:center;gap:0;';

      // SVG track
      const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svgEl.setAttribute('width', trackW); svgEl.setAttribute('height', trackH);
      const svg = d3.select(svgEl);

      // background
      svg.append('rect').attr('x',0).attr('y',0).attr('width',trackW).attr('height',trackH)
        .attr('fill','#1A1A1A').attr('rx',4);

      // filled bar (enter from 0)
      svg.append('rect').attr('x',0).attr('y',(trackH-barH)/2).attr('height',barH)
        .attr('width',0).attr('rx',4)
        .attr('fill',col).attr('data-brand',d.name)
        .transition().duration(600).delay(i*60).ease(d3.easeCubicOut)
        .attr('width', xScale(d.value));

      flex.appendChild(svgEl);

      // score div
      const score = document.createElement('div');
      score.style.cssText = 'width:' + scoreW + 'px;padding-left:10px;' +
        'font-family:' + FONT_TITLE + ';font-style:italic;font-size:' +
        (isPrimary ? '15' : '14') + 'px;color:' + col + ';';
      score.textContent = d.value.toFixed(2);
      flex.appendChild(score);

      row.appendChild(flex);
      el.appendChild(row);
    });

    // axis SVG
    const axisSvg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    axisSvg.setAttribute('width', trackW); axisSvg.setAttribute('height', 18);
    d3.select(axisSvg).append('g')
      .call(d3.axisBottom(xScale).ticks(5).tickSize(0).tickPadding(4))
      .call(ax => ax.select('.domain').remove())
      .selectAll('text').style('fill','var(--grey-700)').style('font-size','8px')
      .style('font-family', FONT_LIGHT);
    el.appendChild(axisSvg);
  }

  // ─── MULTI-SCALE DOTS ────────────────────────────────────────────────────
  function renderMultiScale(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!guardBaAttributes(data)) {
      el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;' +
        'height:100%;font-size:11px;font-family:\'Tableau Light\',Arial,sans-serif;' +
        'color:var(--grey-700)">Attribute data unavailable — pipeline error</div>';
      return;
    }

    const attrs = ['Trust','Innovation','Value','Style','Heritage'];
    const mT = 30, mR = 12, mB = 12, mL = 88;
    const ROW = 28;
    const iW = W - mL - mR;
    const svgH = data.length * ROW + mT + mB;

    const sorted = [
      ...data.filter(d => d.name === primary),
      ...[...data.filter(d => d.name !== primary)]
        .sort((a,b) => d3.mean(attrs, k => b[k]) - d3.mean(attrs, k => a[k])),
    ];

    const allVals = data.flatMap(d => attrs.map(k => d[k]));
    const x = d3.scaleLinear().domain([d3.min(allVals) * 0.95, d3.max(allVals) * 1.05]).range([0, iW]);

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', svgH);
    const g = d3.select(svgEl).append('g').attr('transform', 'translate(' + mL + ',' + mT + ')');

    // column headers above primary row
    const primaryData = sorted.find(d => d.name === primary);
    if (primaryData) {
      attrs.forEach(k => {
        g.append('text').attr('x', x(primaryData[k])).attr('y', -10)
          .attr('text-anchor','middle')
          .style('font-size','7.5px').style('font-family', FONT_LIGHT)
          .style('fill','var(--grey-700)').text(k.slice(0,3).toUpperCase());
      });
    }

    sorted.forEach((d, i) => {
      const isPrimary = d.name === primary;
      const col = isPrimary ? D.primary : D.comp;
      const cy = i * ROW + ROW / 2;
      const attrVals = attrs.map(k => d[k]).filter(v => v != null);
      const minV = d3.min(attrVals), maxV = d3.max(attrVals);

      // track line
      g.append('line').attr('x1', x(minV)).attr('x2', x(maxV)).attr('y1', cy).attr('y2', cy)
        .attr('stroke','var(--grey-700)').attr('stroke-width', 0.5).attr('opacity', 0.6);

      // connector
      g.append('line').attr('x1', x(minV)).attr('x2', x(maxV)).attr('y1', cy).attr('y2', cy)
        .attr('stroke', col).attr('stroke-width', 1).attr('opacity', 0.20);

      // dots
      attrs.forEach((k, ki) => {
        if (d[k] == null) return;
        g.append('circle').attr('cx', x(d[k])).attr('cy', cy).attr('r', 0)
          .attr('fill', col).attr('stroke','#2A2828').attr('stroke-width', 1.5)
          .attr('fill-opacity', isPrimary ? 1 : 0.85).attr('data-brand', d.name)
          .transition().duration(400).delay(i * 60 + ki * 20).ease(d3.easeBackOut)
          .attr('r', isPrimary ? 6 : 5);
      });

      // brand label
      g.append('text').attr('x', -8).attr('y', cy + 4).attr('text-anchor','end')
        .style('font-size', isPrimary ? '10px' : '9px').style('font-family', FONT_LIGHT)
        .style('text-transform','uppercase').style('fill', col).attr('data-brand', d.name)
        .text(d.name);
    });

    // x-axis
    g.append('g').attr('transform', 'translate(0,' + (sorted.length * ROW + 4) + ')')
      .call(d3.axisBottom(x).ticks(4).tickSize(-(sorted.length * ROW + 4))
        .tickFormat(d3.format('.1f')))
      .call(ax => ax.select('.domain').remove())
      .call(ax => ax.selectAll('.tick line').attr('stroke','#4D4D4D').attr('opacity',0.30))
      .selectAll('text').style('fill','var(--grey-700)').style('font-size','9px')
      .style('font-family', FONT_LIGHT);

    el.appendChild(svgEl);
  }

          .attr('fill', fill).attr('opacity', op);
      }
    });

    el.style.overflow = 'hidden';
    el.appendChild(svgEl);
  }

  // ─── SMALL MULTIPLES ──────────────────────────────────────────────────────
  function renderSmallMultiples(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const brands = Object.keys(data[0]).filter(k => k !== 'period');
    const periods = data.map(d => d.period);
    const n = brands.length;
    const panelW = Math.floor(W / n);
    const cellH = H < 220 ? 52 : 88;
    const labelH = 18;
    const svgH = cellH + labelH;
    const iW = panelW - 8, iH = cellH - 4;

    const allVals = brands.flatMap(b => data.map(d => d[b] || 0));
    const globalMin = d3.min(allVals), globalMax = d3.max(allVals);
    const y = d3.scaleLinear().domain([globalMin, globalMax]).range([iH, 0]);
    const x = d3.scalePoint().domain(periods).range([0, iW]).padding(0.1);

    const lineFn = d3.line().x(d => x(d.period)).y(d => y(d.v || 0)).curve(d3.curveMonotoneX);
    const areaFn = d3.area().x(d => x(d.period))
      .y0(iH).y1(d => y(d.v || 0)).curve(d3.curveMonotoneX);

    const sorted = sortWithPrimaryLast(brands.map(b => ({ name: b })), primary).map(d => d.name);

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', svgH);
    const svg = d3.select(svgEl);

    sorted.forEach((b, i) => {
      const isPrimary = b === primary;
      const col = isPrimary ? D.primary : D.comp;
      const px = i * panelW;
      const vals = data.map(d => ({ period: d.period, v: d[b] }));

      // background
      svg.append('rect').attr('x', px + 4).attr('y', 2).attr('width', iW).attr('height', iH)
        .attr('fill','#1A1A1A').attr('rx', 3);

      const g = svg.append('g').attr('transform', 'translate(' + (px + 4) + ',2)');

      // area
      g.append('path').datum(vals).attr('fill', col)
        .attr('fill-opacity', isPrimary ? 0.50 : 0.28).attr('d', areaFn)
        .attr('data-brand', b);

      // line
      const path = g.append('path').datum(vals).attr('fill','none')
        .attr('stroke', col).attr('stroke-width', isPrimary ? 1.5 : 1).attr('d', lineFn)
        .attr('data-brand', b).style('cursor','pointer');
      const len = path.node().getTotalLength();
      path.attr('stroke-dasharray', len).attr('stroke-dashoffset', len)
        .transition().duration(600).ease(d3.easeLinear).attr('stroke-dashoffset', 0);

      // brand label
      svg.append('text').attr('x', px + panelW / 2).attr('y', cellH + 14)
        .attr('text-anchor','middle')
        .style('font-size', isPrimary ? '9.5px' : '8.5px').style('font-family', FONT_LIGHT)
        .style('text-transform','uppercase').style('fill', col).attr('data-brand', b)
        .text(b.slice(0, 4));
    });

    el.appendChild(svgEl);
  }

  // ─── ARC (NPS CALLOUT) ────────────────────────────────────────────────────
  function renderArc(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!guardNpsRecalculated(data)) {
      el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;' +
        'height:100%;font-size:11px;font-family:\'Tableau Light\',Arial,sans-serif;' +
        'color:var(--grey-700)">NPS recalculation pending</div>';
      return;
    }

    const illyNps = data.illy ? data.illy.nps : 0;
    const competitors = data.competitors || [];

    const cx = W * 0.40, cy = H * 0.85;
    const R = Math.min(cx, cy * 0.70);
    const sw = Math.max(20, R * 0.18);

    const arcTrack = d3.arc().innerRadius(R - sw).outerRadius(R)
      .startAngle(-Math.PI).endAngle(Math.PI);
    const arcFill = d3.arc().innerRadius(R - sw).outerRadius(R).cornerRadius(sw / 2);

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', H);
    const svg = d3.select(svgEl);

    const g = svg.append('g').attr('transform', 'translate(' + cx + ',' + cy + ')');

    // track
    g.append('path').attr('d', arcTrack()).attr('fill','var(--grey-700)').attr('opacity', 0.28);

    // fill arc via attrTween: maps NPS [-100,+100] → [0, π] starting at -π/2
    const endAngle = -Math.PI / 2 + ((illyNps + 100) / 200) * Math.PI;
    g.append('path').attr('fill', D.fill).attr('fill-opacity', 1)
      .transition().duration(800).ease(d3.easeCircleOut)
      .attrTween('d', () => {
        const interp = d3.interpolate(-Math.PI / 2, endAngle);
        return t => arcFill.startAngle(-Math.PI / 2).endAngle(interp(t))();
      });

    // centre value
    g.append('text').attr('y', -10).attr('text-anchor','middle')
      .style('font-size','52px').style('font-family', FONT_TITLE).style('font-style','italic')
      .style('fill', D.fill).text(illyNps);

    // brand sub-label
    g.append('text').attr('y', 14).attr('text-anchor','middle')
      .style('font-size','10px').style('font-family', FONT_LIGHT).style('letter-spacing','0.08em')
      .style('fill','#808080').text('ILLY COFFEE');

    // endpoint labels
    svg.append('text').attr('x', cx - R - 12).attr('y', cy)
      .attr('text-anchor','end').style('font-size','9px').style('font-family', FONT_LIGHT)
      .style('fill','#808080').text('−100');
    svg.append('text').attr('x', cx + R + 12).attr('y', cy)
      .attr('text-anchor','start').style('font-size','9px').style('font-family', FONT_LIGHT)
      .style('fill','#808080').text('+100');

    // competitor list (right panel, only if wide enough)
    if (W >= 400) {
      const xOrig = W * 0.64, yOrig = cy - R * 0.65;
      competitors.forEach((c, i) => {
        const ry = yOrig + i * 22;
        svg.append('circle').attr('cx', xOrig).attr('cy', ry).attr('r', 4)
          .attr('fill','#808080');
        svg.append('text').attr('x', xOrig + 12).attr('y', ry + 4)
          .style('font-size','10px').style('font-family', FONT_LIGHT).style('fill','#B3B3B3')
          .text(c.name);
        svg.append('text').attr('x', W - 16).attr('y', ry + 4).attr('text-anchor','end')
          .style('font-size','12px').style('font-family', FONT_TITLE).style('font-style','italic')
          .style('fill','#808080').text(c.nps);
      });
    }

    el.appendChild(svgEl);
  }

  // ─── ERROR ────────────────────────────────────────────────────────────────
  function showError(msg) {
    document.getElementById('chart').innerHTML = `<div class="error">⚠ ${msg}</div>`;
  }

  // ─── RESIZE OBSERVER ─────────────────────────────────────────────────────
  const resizeObserver = new ResizeObserver(() => {
    if (_lastData) renderChart(_lastData, _lastSelected, _dashboard);
  });
  resizeObserver.observe(document.getElementById('chart'));

  </script>
</body>
</html>
