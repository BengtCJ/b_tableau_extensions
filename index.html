<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BP Chart Extensions</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="tableau.extensions.js" onerror="console.warn('tableau.extensions.js not found')"></script>
  <style>
    :root {
      --grey-900: #1A1A1A;
      --grey-800: #2A2828;
      --grey-700: #4D4D4D;
      --grey-500: #808080;
      --grey-300: #B3B3B3;
      --grey-100: #E6E6E6;
      --primary-500: #E994A2;
      --primary-700: #E0697D;
      --primary-900: #D73F58;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Tableau Regular', Georgia, serif;
      overflow: hidden;
    }

    #chart {
      width: 100%;
      height: 100%;
      min-height: 300px;
      display: block;
    }

    .error {
      color: #e994a2;
      font-size: 13px;
      padding: 16px;
      font-family: monospace;
    }

    .loading {
      color: #666666;
      font-size: 13px;
      padding: 16px;
      font-family: 'Tableau Light', Georgia, serif;
    }

    /* ── Settings Dialog ── */
    #settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #settings-dialog {
      background: #222222;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      width: 720px;
      max-width: 95vw;
      color: #e6e6e6;
      font-family: 'Tableau Light', Georgia, serif;
    }

    #settings-dialog h2 {
      font-size: 15px;
      color: #e994a2;
      margin-bottom: 16px;
      font-weight: 400;
      letter-spacing: 0.06em;
      font-family: 'Tableau Light', Georgia, serif;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    #settings-dialog h2 .version {
      font-size: 10px;
      color: #666;
      letter-spacing: 0.04em;
      font-style: normal;
    }

    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px 16px;
    }

    .field { margin-bottom: 0; }
    .field-full { grid-column: 1 / -1; }

    .field label {
      display: block;
      font-size: 10px;
      color: #666666;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 3px;
      font-family: 'Tableau Light', Georgia, serif;
    }

    .field select,
    .field input[type="text"] {
      width: 100%;
      background: #333333;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e6e6e6;
      padding: 4px 8px;
      font-size: 12px;
      font-family: 'Tableau Light', Georgia, serif;
      outline: none;
    }

    .field select:focus,
    .field input:focus {
      border-color: #e994a2;
    }

    .field input[type="color"] {
      width: 100%;
      height: 30px;
      padding: 2px;
      background: #333333;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
    }

    .transparent-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }

    .transparent-row input[type="checkbox"] {
      accent-color: #e994a2;
      width: 13px;
      height: 13px;
      cursor: pointer;
    }

    .transparent-row span {
      font-size: 10px;
      color: #666;
      font-family: 'Tableau Light', Georgia, serif;
    }

    .field .hint {
      font-size: 10px;
      color: #555;
      margin-top: 3px;
      font-family: 'Tableau Light', Georgia, serif;
    }

    .settings-footer {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .btn {
      padding: 6px 16px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Tableau Light', Georgia, serif;
      letter-spacing: 0.05em;
    }

    .btn-primary { background: #e994a2; color: #222; }
    .btn-primary:hover { background: #d4778a; }
    .btn-secondary { background: #333333; color: #e6e6e6; border: 1px solid #555; }
    .btn-secondary:hover { background: #3a3a3a; }

    /* ── Configure gear button ── */
    #configure-btn {
      position: fixed;
      bottom: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      background: rgba(233,148,162,0.15);
      border: 1px solid #e994a2;
      border-radius: 50%;
      color: #e994a2;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0.4;
      transition: opacity 0.2s;
    }
    #configure-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="chart"><div class="loading">Loading...</div></div>
  <button id="configure-btn" title="Configure chart">⚙</button>

  <script>
  // ─── VERSION ──────────────────────────────────────────────────────────────
  const VERSION = '2026-05-15.5';

  // ─── FONTS ────────────────────────────────────────────────────────────────
  const FONT_TITLE = "'Baskerville', Georgia, serif";
  const FONT_BODY  = "'Tableau Regular', Georgia, serif";
  const FONT_LIGHT = "'Tableau Light', Georgia, serif";

  // ─── BASE COLOURS ─────────────────────────────────────────────────────────
  const COL_WHITE      = '#ffffff';
  const COL_LIGHT_GREY = '#e6e6e6';
  const COL_DARK_GREY  = '#666666';
  const COL_GRID       = '#444444';

  // ─── METRIC → CHART MAPPING ───────────────────────────────────────────────
  // First chart in each array = recommended (primary). Others = alternatives.
  const METRIC_CHARTS = {
    tam:   ['ban'],
    cagr:  ['ban'],
    svt:   ['line-straight', 'line-smooth', 'small-multiples'],
    sop:   ['scale-figma', 'slope'],
    cra:   ['hbar'],
    bss:   ['area-100', 'treemap-bar', 'slope', 'stream', 'bubbles', 'small-multiples'],
    dvtr:  ['bans', 'hbar', 'scale-figma'],
    sstsr: ['hbar'],
    eqr:   ['vbar-stacked', 'inset-bubble', 'progress-ring', 'waffle'],
    sov:   ['area-100', 'treemap-bar', 'bubbles', 'inset-bubble', 'stream', 'small-multiples'],
    vom:   ['line-smooth', 'line-straight'],
    nps:   ['waffle', 'dot-matrix', 'inset-bubble', 'arc', 'bans'],
    ba:    ['multiscale'],
    ebl:   ['vbar-stacked', 'inset-bubble'],
    bt:    ['scale-figma', 'bans'],
  };

  // ─── DESIGN SYSTEM ────────────────────────────────────────────────────────
  function buildDesign() {
    const sel = CONFIG.selectedColor;
    return {
      donut: {
        banValue:      { font: FONT_TITLE, style: 'italic', color: sel },
        banLabel:      { font: FONT_LIGHT, style: 'normal', color: COL_LIGHT_GREY },
        legendLabel:   { font: FONT_LIGHT, style: 'normal', color: COL_DARK_GREY },
        legendValue:   { font: FONT_LIGHT, style: 'normal', color: COL_LIGHT_GREY },
        legendSelected:{ font: FONT_LIGHT, style: 'normal', color: sel },
      },
      bar: {
        valueLabel:    { font: FONT_LIGHT, style: 'normal', color: COL_LIGHT_GREY },
        valueLabelSel: { font: FONT_BODY,  style: 'normal', color: sel },
        axisLabel:     { font: FONT_LIGHT, style: 'normal', color: COL_DARK_GREY },
        axisLabelSel:  { font: FONT_LIGHT, style: 'normal', color: sel },
      },
      line: {
        axisX:     { font: FONT_LIGHT, style: 'normal', color: COL_DARK_GREY },
        axisY:     { font: FONT_LIGHT, style: 'normal', color: COL_DARK_GREY },
        gridColor: COL_GRID,
      },
      ban: {
        value: { font: FONT_TITLE, style: 'italic', color: sel },
        label: { font: FONT_LIGHT, style: 'normal', color: COL_LIGHT_GREY },
      },
      bans: {
        primaryValue: { font: FONT_TITLE, size: 56, color: sel },
        compValue:    { font: FONT_TITLE, size: 32, color: '#808080' },
      },
      slope:         { lineP: { color: sel, width: 2.5 }, lineC: { color: '#808080', width: 1 } },
      area100:       { primary: sel, comp: '#808080' },
      stream:        { primary: sel, comp: '#808080' },
      treemap:       { primary: sel, comp: '#808080' },
      treemapBar:    { primary: sel, comp: '#808080' },
      bubbles:       { primary: sel, comp: '#808080' },
      insetBubble:   { primary: sel, comp: '#808080' },
      progressRing:  { primary: sel, comp: '#808080' },
      waffle:        { filled: sel, comp: '#808080', empty: '#4D4D4D', neg: '#D73F58' },
      hbar:          { primary: sel, comp: '#808080' },
      vbarStacked:   { primaryActive: sel, primaryPassive: '#E0697D', compActive: '#808080', compPassive: '#4D4D4D' },
      scaleFigma:    { primary: sel, comp: '#808080' },
      multiscale:    { primary: sel, comp: '#808080' },
      dotMatrix:     { filled: sel, comp: '#808080', passive: '#4D4D4D', neg: '#D73F58' },
      smallMultiples:{ primary: sel, comp: '#808080' },
      arc:           { fill: sel },
    };
  }

  // ─── SHARED HELPERS ───────────────────────────────────────────────────────
  function sortWithPrimaryLast(data, primary) {
    return [
      ...data.filter(d => d.name !== primary),
      ...data.filter(d => d.name === primary),
    ];
  }

  function showTooSmall(el) {
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;' +
      'height:100%;font-size:11px;font-family:\'Tableau Light\',Arial,sans-serif;' +
      'color:var(--grey-700)">Container too small</div>';
  }

  function showEmpty(el) {
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;' +
      'height:100%;font-size:11px;font-family:\'Tableau Light\',Arial,sans-serif;' +
      'color:var(--grey-700)">No data available</div>';
  }

  function applySelectionOpacity(svgEl, selected) {
    d3.select(svgEl).selectAll('[data-brand]')
      .transition().duration(180).ease(d3.easeCubicOut)
      .attr('opacity', function() {
        const b = this.getAttribute('data-brand');
        if (!selected) return 1;
        if (b === selected) return 1;
        if (b === _lastSelected) return 0.35;
        return 0.2;
      });
  }

  // ─── DEFAULT CONFIG ───────────────────────────────────────────────────────
  const DEFAULTS = {
    chart:         'donut',
    metricId:      '',
    worksheet:     '',
    brandField:    'Brand Name Upper',
    valueField:    'SUM(Raw Value)',
    periodField:   'Quarter',
    parameter:     'Select Client Brand',
    selectedColor: '#e994a2',
    neutralColor:  '#7d7d7d',
    bgColor:       'transparent',
  };

  // ─── STATE ────────────────────────────────────────────────────────────────
  let _dashboard      = null;
  let _lastData       = null;
  let _lastSelected   = null;
  let _selectedBrand  = null;
  let CONFIG          = { ...DEFAULTS };

  // ─── APPLY BACKGROUND ─────────────────────────────────────────────────────
  function applyBackground() {
    document.body.style.background = CONFIG.bgColor;
    document.documentElement.style.background = CONFIG.bgColor;
  }

  // ─── DATA GUARDS ─────────────────────────────────────────────────────────
  function guardLikertNotPercent(data, metricId) {
    if (data.some(d => d.value > 1 && d.value <= 5)) {
      console.warn('[' + metricId + '] Values look like Likert means (1–5), not percentages. Skipping render.');
      return false;
    }
    return true;
  }

  function guardStarbucksPresent(data, metricId) {
    if (!data.some(d => d.name === 'Starbucks'))
      console.warn('[' + metricId + '] Starbucks missing from dataset.');
  }

  function guardSvtZeros(data) {
    const q4zero = data.filter(d =>
      ['Sep','Oct','Nov','Dec'].includes(d.month) && d.value === 0);
    if (q4zero.length > 0)
      console.warn('[svt] Q4 values are zero — pipeline unpopulated. Rendering with annotation.');
    return q4zero.length > 0;
  }

  function guardNpsRecalculated(data) {
    if (data && data.illy && data.illy.nps > 5) return true;
    console.warn('[nps] Values appear to be Likert means, not true NPS. Arc blocked.');
    return false;
  }

  function guardBaAttributes(data) {
    if (!data[0] || !data[0].Trust) {
      console.warn('[ba] Attribute columns missing (need Trust, Innovation, Value, Style, Heritage).');
      return false;
    }
    return true;
  }

  // ─── SAMPLE DATA ─────────────────────────────────────────────────────────
  function getSampleData(chart) {
    const WIDE_PERIODS = [
      { period:'Jan','Illy Coffee':0.57,Starbucks:82,Nespresso:10.7,Lavazza:3.9,"Peet's Coffee":2.83 },
      { period:'Feb','Illy Coffee':0.55,Starbucks:81,Nespresso:11.1,Lavazza:4.1,"Peet's Coffee":3.29 },
      { period:'Mar','Illy Coffee':0.59,Starbucks:83,Nespresso:10.4,Lavazza:3.7,"Peet's Coffee":2.31 },
      { period:'Apr','Illy Coffee':0.61,Starbucks:82,Nespresso:10.9,Lavazza:3.8,"Peet's Coffee":2.69 },
      { period:'May','Illy Coffee':0.64,Starbucks:80,Nespresso:11.5,Lavazza:4.2,"Peet's Coffee":3.66 },
      { period:'Jun','Illy Coffee':0.62,Starbucks:81,Nespresso:11.2,Lavazza:4.0,"Peet's Coffee":3.18 },
    ];

    if (chart === 'line') {
      return [
        { name: 'Starbucks',   period: 'Q1', value: 6.2 },
        { name: 'Starbucks',   period: 'Q2', value: 6.8 },
        { name: 'Starbucks',   period: 'Q3', value: 7.1 },
        { name: 'Starbucks',   period: 'Q4', value: 6.9 },
        { name: 'Nespresso',   period: 'Q1', value: 4.8 },
        { name: 'Nespresso',   period: 'Q2', value: 5.1 },
        { name: 'Nespresso',   period: 'Q3', value: 5.4 },
        { name: 'Nespresso',   period: 'Q4', value: 5.2 },
        { name: 'Illy Coffee', period: 'Q1', value: 3.9 },
        { name: 'Illy Coffee', period: 'Q2', value: 4.0 },
        { name: 'Illy Coffee', period: 'Q3', value: 4.2 },
        { name: 'Illy Coffee', period: 'Q4', value: 4.5 },
      ];
    }
    if (chart === 'line-straight' || chart === 'line-smooth') return WIDE_PERIODS;
    if (chart === 'area-100' || chart === 'stream' || chart === 'small-multiples') return WIDE_PERIODS;
    if (chart === 'slope') return [
      { name: 'Illy Coffee',   v1: 0.57, v2: 0.64 },
      { name: 'Starbucks',     v1: 82.0, v2: 80.0 },
      { name: 'Nespresso',     v1: 10.7, v2: 11.5 },
      { name: 'Lavazza',       v1: 3.9,  v2: 4.2  },
      { name: "Peet's Coffee", v1: 2.83, v2: 3.66 },
    ];
    if (chart === 'waffle' || chart === 'dot-matrix') return [
      { name: 'Illy Coffee',   promoterFraction: 0.45, passiveFraction: 0.30, detractorFraction: 0.25 },
      { name: 'Starbucks',     promoterFraction: 0.52, passiveFraction: 0.28, detractorFraction: 0.20 },
      { name: 'Nespresso',     promoterFraction: 0.38, passiveFraction: 0.35, detractorFraction: 0.27 },
      { name: 'Lavazza',       promoterFraction: 0.31, passiveFraction: 0.39, detractorFraction: 0.30 },
      { name: "Peet's Coffee", promoterFraction: 0.29, passiveFraction: 0.41, detractorFraction: 0.30 },
    ];
    if (chart === 'vbar-stacked') return [
      { name: 'Illy Coffee',   active: 0.082, passive: 0.918 },
      { name: 'Starbucks',     active: 0.134, passive: 0.866 },
      { name: 'Nespresso',     active: 0.097, passive: 0.903 },
      { name: 'Lavazza',       active: 0.071, passive: 0.929 },
      { name: "Peet's Coffee", active: 0.058, passive: 0.942 },
    ];
    if (chart === 'multiscale') return [
      { name: 'Illy Coffee',   Trust: 3.8, Innovation: 3.2, Value: 2.9, Style: 4.1, Heritage: 4.4 },
      { name: 'Starbucks',     Trust: 4.2, Innovation: 4.0, Value: 3.5, Style: 3.8, Heritage: 3.1 },
      { name: 'Nespresso',     Trust: 3.9, Innovation: 4.1, Value: 3.2, Style: 4.3, Heritage: 3.6 },
      { name: 'Lavazza',       Trust: 3.5, Innovation: 2.9, Value: 3.8, Style: 3.4, Heritage: 4.1 },
      { name: "Peet's Coffee", Trust: 3.2, Innovation: 3.1, Value: 4.0, Style: 2.9, Heritage: 3.3 },
    ];
    if (chart === 'arc') return {
      illy: { nps: 24 },
      competitors: [
        { name: "Peet's Coffee", nps: 18 },
        { name: 'Lavazza',       nps: 14 },
        { name: 'Starbucks',     nps: 12 },
        { name: 'Nespresso',     nps: 8  },
      ],
    };
    return [
      { name: 'Starbucks',     value: 6.8 },
      { name: 'Nespresso',     value: 5.4 },
      { name: 'Illy Coffee',   value: 4.2 },
      { name: 'Lavazza',       value: 3.9 },
      { name: "Peet's Coffee", value: 3.1 },
    ];
  }

  // ─── COLUMN DISCOVERY ────────────────────────────────────────────────────────
  async function loadColumnOptions(worksheetName) {
    if (!_dashboard || !worksheetName) return [];
    const ws = _dashboard.worksheets.find(w => w.name === worksheetName);
    if (!ws) return [];
    try {
      const dt = await ws.getSummaryDataAsync({ maxRows: 1 });
      return dt.columns.map(c => c.fieldName);
    } catch(e) { return []; }
  }

  // ─── SETTINGS DIALOG ─────────────────────────────────────────────────────
  async function showSettings(worksheets) {
    const existing = document.getElementById('settings-overlay');
    if (existing) existing.remove();

    const columns = await loadColumnOptions(CONFIG.worksheet);

    const overlay = document.createElement('div');
    overlay.id = 'settings-overlay';

    const isTransparent = CONFIG.bgColor === 'transparent';
    const bgColorValue  = isTransparent ? '#333333' : CONFIG.bgColor;

    const worksheetOptions = worksheets
      ? worksheets.map(ws => `<option value="${ws}" ${ws === CONFIG.worksheet ? 'selected' : ''}>${ws}</option>`).join('')
      : `<option value="${CONFIG.worksheet}">${CONFIG.worksheet || 'No worksheets found'}</option>`;

    const colOptions = columns.map(c => `<option value="${c}">`).join('');

    overlay.innerHTML = `
      <div id="settings-dialog">
        <h2>⚙ Chart Settings <span class="version">v${VERSION}</span></h2>
        <datalist id="s-columns">${colOptions}</datalist>
        <div class="fields-grid">

          <div class="field">
            <label>Metric / Indicator ID</label>
            <input id="s-metric" type="text" value="${CONFIG.metricId}" list="s-metric-ids"
              placeholder="e.g. bss, nps, sov — filters chart list">
            <datalist id="s-metric-ids">
              <option value="tam"><option value="cagr"><option value="svt">
              <option value="sop"><option value="cra"><option value="bss">
              <option value="dvtr"><option value="sstsr"><option value="eqr">
              <option value="sov"><option value="vom"><option value="nps">
              <option value="ba"><option value="ebl"><option value="bt">
            </datalist>
            <div id="s-chart-metric-hint" class="hint" style="color:#e994a2"></div>
          </div>

          <div class="field">
            <label>Chart Type</label>
            <select id="s-chart">
              <option value="donut"          ${CONFIG.chart==='donut'          ?'selected':''}>Donut</option>
              <option value="bar"            ${CONFIG.chart==='bar'            ?'selected':''}>Bar</option>
              <option value="line"           ${CONFIG.chart==='line'           ?'selected':''}>Line</option>
              <option value="ban"            ${CONFIG.chart==='ban'            ?'selected':''}>BAN (Headline Number)</option>
              <option value="bans"           ${CONFIG.chart==='bans'           ?'selected':''}>BANs (Multi-brand headline)</option>
              <option value="line-straight"  ${CONFIG.chart==='line-straight'  ?'selected':''}>Line — Straight</option>
              <option value="line-smooth"    ${CONFIG.chart==='line-smooth'    ?'selected':''}>Line — Smooth</option>
              <option value="slope"          ${CONFIG.chart==='slope'          ?'selected':''}>Slope chart</option>
              <option value="area-100"       ${CONFIG.chart==='area-100'       ?'selected':''}>Stacked 100% Area</option>
              <option value="stream"         ${CONFIG.chart==='stream'         ?'selected':''}>Stream graph</option>
              <option value="treemap"        ${CONFIG.chart==='treemap'        ?'selected':''}>Treemap</option>
              <option value="treemap-bar"    ${CONFIG.chart==='treemap-bar'    ?'selected':''}>Treemap bar</option>
              <option value="bubbles"        ${CONFIG.chart==='bubbles'        ?'selected':''}>Bubbles</option>
              <option value="inset-bubble"   ${CONFIG.chart==='inset-bubble'   ?'selected':''}>Inset bubble</option>
              <option value="progress-ring"  ${CONFIG.chart==='progress-ring'  ?'selected':''}>Progress ring</option>
              <option value="waffle"         ${CONFIG.chart==='waffle'         ?'selected':''}>Waffle chart</option>
              <option value="hbar"           ${CONFIG.chart==='hbar'           ?'selected':''}>Horizontal bar</option>
              <option value="vbar-stacked"   ${CONFIG.chart==='vbar-stacked'   ?'selected':''}>Vertical bar stacked</option>
              <option value="scale-figma"    ${CONFIG.chart==='scale-figma'    ?'selected':''}>Scale · Figma</option>
              <option value="multiscale"     ${CONFIG.chart==='multiscale'     ?'selected':''}>Multi-scale dots</option>
              <option value="dot-matrix"     ${CONFIG.chart==='dot-matrix'     ?'selected':''}>Dot matrix</option>
              <option value="small-multiples"${CONFIG.chart==='small-multiples'?'selected':''}>Small multiples</option>
              <option value="arc"            ${CONFIG.chart==='arc'            ?'selected':''}>Arc (NPS callout)</option>
            </select>
          </div>

          <div class="field">
            <label>Worksheet</label>
            <select id="s-worksheet">${worksheetOptions}</select>
            <div class="hint">Source of brand data</div>
          </div>

          <div class="field">
            <label>Brand Field</label>
            <input id="s-brandField" type="text" value="${CONFIG.brandField}" list="s-columns">
          </div>

          <div class="field">
            <label>Value Field</label>
            <input id="s-valueField" type="text" value="${CONFIG.valueField}" list="s-columns">
          </div>

          <div class="field">
            <label>Period Field <span style="color:#555">(line only)</span></label>
            <input id="s-periodField" type="text" value="${CONFIG.periodField}" list="s-columns">
          </div>

          <div class="field">
            <label>Select Brand Parameter</label>
            <input id="s-parameter" type="text" value="${CONFIG.parameter}">
          </div>

          <div class="field">
            <label>Highlight Colour</label>
            <input id="s-selectedColor" type="color" value="${CONFIG.selectedColor}">
            <div class="hint">Selected brand colour</div>
          </div>

          <div class="field">
            <label>Neutral Colour</label>
            <input id="s-neutralColor" type="color" value="${CONFIG.neutralColor}">
            <div class="hint">Non-selected brand colour</div>
          </div>

          <div class="field">
            <label>Background Colour</label>
            <input id="s-bgColor" type="color" value="${bgColorValue}" ${isTransparent ? 'disabled' : ''} style="${isTransparent ? 'opacity:0.4' : ''}">
            <div class="transparent-row">
              <input type="checkbox" id="s-transparent" ${isTransparent ? 'checked' : ''}>
              <span>Transparent</span>
            </div>
          </div>

        </div>
        <div class="settings-footer">
          <button class="btn btn-secondary" id="s-cancel">Cancel</button>
          <button class="btn btn-primary" id="s-save">Save & Render</button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    // Metric-based chart filtering
    (function() {
      const metricInput = document.getElementById('s-metric');
      const chartSelect = document.getElementById('s-chart');
      const hint        = document.getElementById('s-chart-metric-hint');
      const LABELS = {
        'ban':'BAN','bans':'BANs','line-straight':'Line Straight',
        'line-smooth':'Line Smooth','slope':'Slope','area-100':'Stacked Area',
        'stream':'Stream','treemap':'Treemap','treemap-bar':'Treemap Bar',
        'bubbles':'Bubbles','inset-bubble':'Inset Bubble','progress-ring':'Progress Ring',
        'waffle':'Waffle','hbar':'Horizontal Bar','vbar-stacked':'Vert. Bar Stacked',
        'scale-figma':'Scale · Figma','multiscale':'Multi-scale Dots',
        'dot-matrix':'Dot Matrix','small-multiples':'Small Multiples','arc':'Arc',
      };
      function filter(id) {
        const charts = METRIC_CHARTS[id.trim().toLowerCase()];
        Array.from(chartSelect.options).forEach(opt => {
          opt.hidden = charts ? !charts.includes(opt.value) : false;
        });
        if (charts) {
          hint.textContent = '★ Recommended: ' + (LABELS[charts[0]] || charts[0]);
          if (chartSelect.selectedOptions.length && chartSelect.selectedOptions[0].hidden) {
            const first = Array.from(chartSelect.options).find(o => !o.hidden);
            if (first) chartSelect.value = first.value;
          }
        } else {
          hint.textContent = id.trim() ? 'Unknown metric ID' : '';
          hint.style.color = id.trim() ? '#666' : '#e994a2';
        }
      }
      metricInput.addEventListener('input', () => filter(metricInput.value));
      filter(metricInput.value);
    })();

    // Reload column suggestions when worksheet changes
    document.getElementById('s-worksheet').addEventListener('change', async function() {
      const cols = await loadColumnOptions(this.value);
      document.getElementById('s-columns').innerHTML = cols.map(c => `<option value="${c}">`).join('');
    });

    // Toggle colour picker when checkbox changes
    const checkbox = document.getElementById('s-transparent');
    const bgInput  = document.getElementById('s-bgColor');
    checkbox.addEventListener('change', () => {
      bgInput.disabled = checkbox.checked;
      bgInput.style.opacity = checkbox.checked ? '0.4' : '1';
    });

    document.getElementById('s-cancel').onclick = () => overlay.remove();

    document.getElementById('s-save').onclick = async () => {
      CONFIG.chart         = document.getElementById('s-chart').value;
      CONFIG.metricId      = document.getElementById('s-metric').value.trim().toLowerCase();
      CONFIG.worksheet     = document.getElementById('s-worksheet').value;
      CONFIG.brandField    = document.getElementById('s-brandField').value;
      CONFIG.valueField    = document.getElementById('s-valueField').value;
      CONFIG.periodField   = document.getElementById('s-periodField').value;
      CONFIG.parameter     = document.getElementById('s-parameter').value;
      CONFIG.selectedColor = document.getElementById('s-selectedColor').value;
      CONFIG.neutralColor  = document.getElementById('s-neutralColor').value;
      CONFIG.bgColor       = document.getElementById('s-transparent').checked
                             ? 'transparent'
                             : document.getElementById('s-bgColor').value;

      if (_dashboard) {
        try {
          const settings = tableau.extensions.settings;
          Object.entries(CONFIG).forEach(([k, v]) => settings.set(k, v));
          await settings.saveAsync();
          console.log('Settings saved:', JSON.stringify(CONFIG));
        } catch(e) {
          console.warn('Settings save failed:', e);
        }
      }

      applyBackground();
      overlay.remove();

      _selectedBrand = null;
      if (_dashboard) {
        const worksheet = _dashboard.worksheets.find(ws => ws.name === CONFIG.worksheet);
        if (worksheet) await fetchAndRender(worksheet, _dashboard);
      } else {
        renderChart(getSampleData(CONFIG.chart), 'Illy Coffee', null);
      }
    };
  }

  document.getElementById('configure-btn').onclick = async () => {
    const worksheets = _dashboard ? _dashboard.worksheets.map(ws => ws.name) : null;
    await showSettings(worksheets);
  };

  // ─── LOAD TABLEAU API ─────────────────────────────────────────────────────
  function loadTableauAPI() {
    return Promise.resolve();
  }

  // ─── APPLY BACKGROUND IMMEDIATELY ────────────────────────────────────────
  applyBackground();

  // ─── TABLEAU INIT ─────────────────────────────────────────────────────────
  loadTableauAPI().then(() => {
    if (typeof tableau === 'undefined') {
      showSettings(null);
      return;
    }

    tableau.extensions.initializeAsync({ configure: () => {
      const worksheets = _dashboard ? _dashboard.worksheets.map(ws => ws.name) : null;
      showSettings(worksheets);
    }}).then(async () => {
      _dashboard = tableau.extensions.dashboardContent.dashboard;

      const settings = tableau.extensions.settings;
      Object.keys(DEFAULTS).forEach(k => {
        const val = settings.get(k);
        if (val) CONFIG[k] = val;
      });

      console.log('Loaded CONFIG:', JSON.stringify(CONFIG));
      console.log('All settings:', JSON.stringify(settings.getAll()));

      applyBackground();

      if (!CONFIG.worksheet) {
        const worksheets = _dashboard.worksheets.map(ws => ws.name);
        showSettings(worksheets);
        return;
      }

      const worksheet = _dashboard.worksheets.find(ws => ws.name === CONFIG.worksheet);
      if (!worksheet) {
        const worksheets = _dashboard.worksheets.map(ws => ws.name);
        showSettings(worksheets);
        return;
      }

      try { await worksheet.clearSelectedMarksAsync(); } catch(e) {}
      await fetchAndRender(worksheet, _dashboard);

      const allParams = await _dashboard.getParametersAsync();
      const param = allParams.find(p => p.name === CONFIG.parameter);
      if (param) {
        param.addEventListener(tableau.TableauEventType.ParameterChanged, () => {
          fetchAndRender(worksheet, _dashboard);
        });
      }


    }).catch((err) => {
      console.error('initializeAsync failed:', err);
      showSettings(null);
    });
  });

  // ─── DATA FETCHING ────────────────────────────────────────────────────────
  async function fetchAndRender(worksheet, dashboard) {
    try {
      const dataTable = await worksheet.getSummaryDataAsync();
      const cols = dataTable.columns;
      const rows = dataTable.data;

      const brandIdx  = cols.findIndex(c => c.fieldName === CONFIG.brandField);
      const valueIdx  = cols.findIndex(c => c.fieldName === CONFIG.valueField);
      const periodIdx = cols.findIndex(c => c.fieldName === CONFIG.periodField);

      if (brandIdx === -1 || valueIdx === -1) {
        const available = cols.map(c => c.fieldName).join(', ');
        showError(`Field not found. Need "${CONFIG.brandField}" + "${CONFIG.valueField}". Available: ${available}`);
        return;
      }

      const data = rows.map(row => {
        const entry = {
          name:  row[brandIdx].formattedValue || row[brandIdx].value,
          value: parseFloat(row[valueIdx].value) || 0,
        };
        if (periodIdx !== -1) entry.period = row[periodIdx].formattedValue || row[periodIdx].value;
        return entry;
      }).filter(d => d.value > 0);

      if (!_selectedBrand) {
        const allParams = await dashboard.getParametersAsync();
        const param = allParams.find(p => p.name === CONFIG.parameter);
        if (param) {
          const raw = (param.currentValue.value || param.currentValue.formattedValue || '').trim();
          const match = data.find(d => d.name.trim().toLowerCase() === raw.toLowerCase());
          _selectedBrand = match ? match.name : (data[0]?.name || '');
        } else {
          _selectedBrand = data[0]?.name || '';
        }
      }
      renderChart(data, _selectedBrand, dashboard);
    } catch(err) {
      showError('Data error: ' + err.message);
    }
  }

  // ─── ROUTER ───────────────────────────────────────────────────────────────
  function renderChart(data, selectedBrand, dashboard) {
    _lastData     = data;
    _lastSelected = selectedBrand;

    const el = document.getElementById('chart');
    el.innerHTML = '';
    el.removeAttribute('style');

    const D = buildDesign();

    switch (CONFIG.chart) {
      case 'donut':          renderDonut(el, data, selectedBrand, dashboard, D.donut);           break;
      case 'bar':            renderBar(el, data, selectedBrand, dashboard, D.bar);               break;
      case 'line':           renderLine(el, data, selectedBrand, dashboard, D.line);             break;
      case 'ban':            renderBAN(el, data, selectedBrand, D.ban);                          break;
      case 'bans':           renderBANs(el, data, selectedBrand, D.bans);                        break;
      case 'line-straight':  renderLineChart(el, data, selectedBrand, true);                     break;
      case 'line-smooth':    renderLineChart(el, data, selectedBrand, false);                    break;
      case 'slope':          renderSlope(el, data, selectedBrand, D.slope);                      break;
      case 'area-100':       renderArea100(el, data, selectedBrand, D.area100);                  break;
      case 'stream':         renderStream(el, data, selectedBrand, D.stream);                    break;
      case 'treemap':        renderTreemap(el, data, selectedBrand, D.treemap);                  break;
      case 'treemap-bar':    renderTreemapBar(el, data, selectedBrand, D.treemapBar);            break;
      case 'bubbles':        renderBubbles(el, data, selectedBrand, D.bubbles);                  break;
      case 'inset-bubble':   renderInsetBubble(el, data, selectedBrand, D.insetBubble);          break;
      case 'progress-ring':  renderProgressRing(el, data, selectedBrand, D.progressRing);        break;
      case 'waffle':         renderWaffle(el, data, selectedBrand, D.waffle);                    break;
      case 'hbar':           renderHBar(el, data, selectedBrand, dashboard, D.hbar);             break;
      case 'vbar-stacked':   renderVBarStacked(el, data, selectedBrand, D.vbarStacked);          break;
      case 'scale-figma':    renderScaleFigma(el, data, selectedBrand, D.scaleFigma);            break;
      case 'multiscale':     renderMultiScale(el, data, selectedBrand, D.multiscale);            break;
      case 'dot-matrix':     renderDotMatrix(el, data, selectedBrand, D.dotMatrix);              break;
      case 'small-multiples':renderSmallMultiples(el, data, selectedBrand, D.smallMultiples);    break;
      case 'arc':            renderArc(el, data, selectedBrand, D.arc);                          break;
      default: showError('Unknown chart type: "' + CONFIG.chart + '"');
    }
  }

  // ─── MARK SELECTOR ───────────────────────────────────────────────────────
  async function selectBrand(name, dashboard) {
    _selectedBrand = name;
    if (_lastData) renderChart(_lastData, _selectedBrand, _dashboard);
    if (!dashboard) return;
    const criteria = [{ fieldName: CONFIG.brandField, value: name }];
    await Promise.allSettled(
      dashboard.worksheets
        .filter(ws => ws.name !== CONFIG.worksheet)
        .map(ws => ws.selectMarksByValueAsync(criteria, tableau.SelectionUpdateType.Replace))
    );
  }

  // ─── CHART: DONUT ─────────────────────────────────────────────────────────
  function renderDonut(el, data, selectedBrand, dashboard, D) {
    const W = el.offsetWidth  || window.innerWidth  || 480;
    const H = el.offsetHeight || window.innerHeight || 300;
    const R = Math.min(H * 0.44, W * 0.28);
    const inner = R * 0.46;

    el.style.display        = 'flex';
    el.style.alignItems     = 'center';
    el.style.justifyContent = 'center';
    el.style.gap            = '20px';
    el.style.padding        = '12px';

    const ban = document.createElement('div');
    ban.style.cssText = 'display:flex;flex-direction:column;gap:6px;min-width:110px;';
    const sel = data.find(d => d.name === selectedBrand) || data[0];
    ban.innerHTML = `
      <div style="font-size:${Math.max(36, R*0.5)}px;line-height:1;
        color:${D.banValue.color};
        font-family:${D.banValue.font};
        font-style:${D.banValue.style};
        font-weight:400;">
        ${sel ? sel.value.toFixed(1) : '--'}
      </div>
      <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
        color:${D.banLabel.color};
        font-family:${D.banLabel.font};">
        ${sel ? sel.name : ''}
      </div>
    `;
    el.appendChild(ban);

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svgEl.setAttribute('width',  R * 2 + 24);
    svgEl.setAttribute('height', R * 2 + 24);
    svgEl.style.flexShrink = '0';
    el.appendChild(svgEl);

    const svg = d3.select(svgEl);
    const g   = svg.append('g').attr('transform', `translate(${R+12},${R+12})`);

    const arc      = d3.arc().innerRadius(inner).outerRadius(R).padAngle(0.028).cornerRadius(2);
    const arcHover = d3.arc().innerRadius(inner).outerRadius(R+7).padAngle(0.028).cornerRadius(2);
    const pie      = d3.pie().value(d => d.value).sort(null);

    const isTransparent = CONFIG.bgColor === 'transparent';
    const holeColor     = isTransparent ? 'transparent' : CONFIG.bgColor;

    g.selectAll('path').data(pie(data)).join('path')
      .attr('d', arc)
      .attr('fill',         d => d.data.name === selectedBrand ? CONFIG.selectedColor : CONFIG.neutralColor)
      .attr('stroke',       holeColor)
      .attr('stroke-width', isTransparent ? 0 : 2)
      .style('cursor',      'pointer')
      .on('mouseover', function() { d3.select(this).attr('d', arcHover); })
      .on('mouseout',  function() { d3.select(this).attr('d', arc); })
      .on('click', async (e, d) => {
        await selectBrand(d.data.name, dashboard);
      });

    g.append('circle')
      .attr('r', inner - 2)
      .attr('fill', holeColor)
      .attr('fill-opacity', isTransparent ? 0 : 1);

    const legend = document.createElement('div');
    legend.style.cssText = 'display:flex;flex-direction:column;gap:7px;';
    data.forEach(d => {
      const isSelected  = d.name === selectedBrand;
      const labelStyle  = isSelected ? D.legendSelected : D.legendLabel;
      const item = document.createElement('div');
      item.style.cssText = `
        display:flex;align-items:center;gap:7px;cursor:pointer;
        font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
        color:${labelStyle.color};font-family:${labelStyle.font};`;
      item.innerHTML = `
        <span style="width:8px;height:8px;border-radius:50%;flex-shrink:0;
          background:${isSelected ? CONFIG.selectedColor : CONFIG.neutralColor};"></span>
        <span style="flex:1;">${d.name}</span>
        <span style="color:${D.legendValue.color};font-family:${D.legendValue.font};">
          ${d.value.toFixed(1)}
        </span>
      `;
      item.onclick = async () => {
        await selectBrand(d.name, dashboard);
      };
      legend.appendChild(item);
    });
    el.appendChild(legend);
  }

  // ─── CHART: BAR ───────────────────────────────────────────────────────────
  function renderBar(el, data, selectedBrand, dashboard, D) {
    const W = el.offsetWidth  || window.innerWidth  || 500;
    const H = el.offsetHeight || window.innerHeight || 300;
    const m = { top: 24, right: 16, bottom: 48, left: 16 };
    const w = W - m.left - m.right;
    const h = H - m.top  - m.bottom;

    const sorted = [...data].sort((a, b) => b.value - a.value);
    const svg = d3.select(el).append('svg').attr('width', W).attr('height', H);
    const g   = svg.append('g').attr('transform', `translate(${m.left},${m.top})`);

    const x = d3.scaleBand().domain(sorted.map(d => d.name)).range([0, w]).padding(0.28);
    const y = d3.scaleLinear().domain([0, d3.max(data, d => d.value) * 1.15]).range([h, 0]);

    g.selectAll('rect').data(sorted).join('rect')
      .attr('x',      d => x(d.name))
      .attr('y',      d => y(d.value))
      .attr('width',  x.bandwidth())
      .attr('height', d => h - y(d.value))
      .attr('fill',   d => d.name === selectedBrand ? CONFIG.selectedColor : CONFIG.neutralColor)
      .attr('rx', 2)
      .style('cursor', 'pointer')
      .on('click', async (e, d) => {
        await selectBrand(d.name, dashboard);
      });

    g.selectAll('.vl').data(sorted).join('text')
      .attr('class', 'vl')
      .attr('x', d => x(d.name) + x.bandwidth() / 2)
      .attr('y', d => y(d.value) - 5)
      .attr('text-anchor', 'middle')
      .style('fill',        d => d.name === selectedBrand ? D.valueLabelSel.color : D.valueLabel.color)
      .style('font-size',   '11px')
      .style('font-family', d => d.name === selectedBrand ? D.valueLabelSel.font : D.valueLabel.font)
      .text(d => d.value.toFixed(1));

    g.append('g').attr('transform', `translate(0,${h})`).call(d3.axisBottom(x).tickSize(0))
      .call(g => g.select('.domain').remove())
      .selectAll('text')
      .style('fill',           d => d === selectedBrand ? D.axisLabelSel.color : D.axisLabel.color)
      .style('font-size',      '10px')
      .style('font-family',    d => d === selectedBrand ? D.axisLabelSel.font : D.axisLabel.font)
      .style('text-transform', 'uppercase')
      .style('letter-spacing', '0.06em')
      .attr('dy', '1.4em');
  }

  // ─── CHART: LINE ──────────────────────────────────────────────────────────
  function renderLine(el, data, selectedBrand, dashboard, D) {
    const W = el.offsetWidth  || window.innerWidth  || 500;
    const H = el.offsetHeight || window.innerHeight || 300;
    const m = { top: 20, right: 24, bottom: 40, left: 40 };
    const w = W - m.left - m.right;
    const h = H - m.top  - m.bottom;

    if (!data[0]?.period) { renderBar(el, data, selectedBrand, dashboard, buildDesign().bar); return; }

    const brands  = [...new Set(data.map(d => d.name))];
    const periods = [...new Set(data.map(d => d.period))];

    const grouped = brands.map(brand => ({
      name:   brand,
      values: periods.map(period => ({
        period,
        value: data.find(d => d.name === brand && d.period === period)?.value || null,
      })).filter(d => d.value !== null),
    }));

    const svg = d3.select(el).append('svg').attr('width', W).attr('height', H);
    const g   = svg.append('g').attr('transform', `translate(${m.left},${m.top})`);

    const x = d3.scalePoint().domain(periods).range([0, w]).padding(0.1);
    const y = d3.scaleLinear().domain([0, d3.max(data, d => d.value) * 1.1]).range([h, 0]);

    const line = d3.line().defined(d => d.value !== null)
      .x(d => x(d.period)).y(d => y(d.value)).curve(d3.curveMonotoneX);

    grouped.filter(b => b.name !== selectedBrand).forEach(brand => {
      g.append('path').datum(brand.values)
        .attr('fill', 'none').attr('stroke', CONFIG.neutralColor)
        .attr('stroke-width', 1).attr('opacity', 0.5).attr('d', line);
    });

    const selBrand = grouped.find(b => b.name === selectedBrand);
    if (selBrand) {
      g.append('path').datum(selBrand.values)
        .attr('fill', 'none').attr('stroke', CONFIG.selectedColor)
        .attr('stroke-width', 2.5).attr('d', line);

      g.selectAll('.dot').data(selBrand.values).join('circle')
        .attr('class', 'dot')
        .attr('cx', d => x(d.period)).attr('cy', d => y(d.value))
        .attr('r', 3.5).attr('fill', CONFIG.selectedColor);
    }

    g.append('g').attr('transform', `translate(0,${h})`)
      .call(d3.axisBottom(x).tickSize(3))
      .call(g => g.select('.domain').attr('stroke', D.gridColor))
      .selectAll('text')
      .style('fill',           D.axisX.color)
      .style('font-size',      '11px')
      .style('font-family',    D.axisX.font)
      .style('text-transform', 'uppercase')
      .style('letter-spacing', '0.06em');

    g.append('g')
      .call(d3.axisLeft(y).ticks(4).tickSize(-w))
      .call(g => g.select('.domain').remove())
      .call(g => g.selectAll('.tick line').attr('stroke', D.gridColor).attr('stroke-dasharray', '3,3'))
      .selectAll('text')
      .style('fill',        D.axisY.color)
      .style('font-size',   '11px')
      .style('font-family', D.axisY.font);
  }

  // ─── CHART: BAN ───────────────────────────────────────────────────────────
  function renderBAN(el, data, selectedBrand, D) {
    const sel = data.find(d => d.name === selectedBrand) || data[0];
    const W = el.offsetWidth || window.innerWidth || 200;
    const fontSize = Math.min(Math.max(W * 0.22, 40), 96);

    el.style.display        = 'flex';
    el.style.flexDirection  = 'column';
    el.style.alignItems     = 'center';
    el.style.justifyContent = 'center';
    el.style.height         = '100%';
    el.style.gap            = '8px';

    el.innerHTML = `
      <div style="font-size:${fontSize}px;font-weight:400;line-height:1;
        color:${D.value.color};font-family:${D.value.font};font-style:${D.value.style};">
        ${sel ? sel.value.toFixed(1) : '--'}
      </div>
      <div style="font-size:12px;letter-spacing:0.1em;text-transform:uppercase;
        color:${D.label.color};font-family:${D.label.font};">
        ${sel ? sel.name : ''}
      </div>
    `;
  }

  // ─── BANs ─────────────────────────────────────────────────────────────────
  function renderBANs(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const sorted = [
      ...data.filter(d => d.name === primary),
      ...[...data.filter(d => d.name !== primary)].sort((a,b) => b.value - a.value),
    ];

    el.style.display = 'flex';
    el.style.alignItems = 'flex-end';
    el.style.flexWrap = 'wrap';
    el.style.padding = '16px 20px';

    sorted.forEach((d, i) => {
      const isPrimary = d.name === primary;
      const wrap = document.createElement('div');
      wrap.style.cssText = isPrimary
        ? 'padding-right:24px;margin-right:24px;border-right:1px solid var(--grey-700);'
        : 'padding-right:20px;';

      const lbl = document.createElement('div');
      lbl.style.cssText = 'font-family:' + FONT_LIGHT + ';font-size:' + (isPrimary ? '7.5' : '7') + 'px;' +
        'text-transform:uppercase;letter-spacing:0.12em;margin-bottom:4px;' +
        'color:' + (isPrimary ? D.primaryValue.color : D.compValue.color) + ';';
      lbl.textContent = d.name;

      const val = document.createElement('div');
      val.setAttribute('data-brand', d.name);
      val.style.cssText = 'font-family:' + D.primaryValue.font + ';font-style:italic;' +
        'font-size:' + (isPrimary ? D.primaryValue.size : D.compValue.size) + 'px;' +
        'color:' + (isPrimary ? D.primaryValue.color : D.compValue.color) + ';line-height:0.92;';
      val.textContent = d.value.toFixed(2);

      wrap.appendChild(lbl);
      wrap.appendChild(val);
      el.appendChild(wrap);
    });
  }

  // ─── LINE CHART (straight + smooth) ──────────────────────────────────────
  function renderLineChart(el, data, primary, straight) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const mT = 12, mR = 80, mB = 28, mL = 38;
    const iW = W - mL - mR, iH = H - mT - mB;

    const brands = Object.keys(data[0]).filter(k => k !== 'period');
    const periods = data.map(d => d.period);

    const allVals = [];
    brands.forEach(b => data.forEach(d => { if (d[b] != null) allVals.push(d[b]); }));
    const vMin = d3.min(allVals), vMax = d3.max(allVals);
    const yPad = (vMax - vMin) * 0.1 || 1;

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', H);
    const svg = d3.select(svgEl);
    const g = svg.append('g').attr('transform', 'translate(' + mL + ',' + mT + ')');

    const x = d3.scalePoint().domain(periods).range([0, iW]).padding(0.1);
    const y = d3.scaleLinear().domain([vMin - yPad, vMax + yPad]).range([iH, 0]);
    const curve = straight ? d3.curveLinear : d3.curveMonotoneX;
    const lineFn = d3.line().defined(d => d.v != null).x(d => x(d.p)).y(d => y(d.v)).curve(curve);

    if (y(0) >= 0 && y(0) <= iH) {
      g.append('line').attr('x1', 0).attr('x2', iW).attr('y1', y(0)).attr('y2', y(0))
        .attr('stroke', '#808080').attr('stroke-width', 1).attr('opacity', 0.55);
    }

    const sorted = sortWithPrimaryLast(brands.map(b => ({ name: b })), primary).map(d => d.name);
    const placedY = [];

    sorted.forEach(b => {
      const vals = data.map(d => ({ p: d.period, v: d[b] }));
      const isPrimary = b === primary;
      const col = isPrimary ? CONFIG.selectedColor : '#808080';
      const sw = isPrimary ? 2 : 1;

      const path = g.append('path').datum(vals)
        .attr('fill', 'none').attr('stroke', col).attr('stroke-width', sw)
        .attr('opacity', isPrimary ? 1 : 0.7)
        .attr('d', lineFn);

      // enter transition
      const len = path.node().getTotalLength();
      path.attr('stroke-dasharray', len).attr('stroke-dashoffset', len)
        .transition().duration(800).ease(d3.easeLinear).attr('stroke-dashoffset', 0);

      // end dots
      [vals[0], vals[vals.length - 1]].forEach(pt => {
        if (pt.v == null) return;
        g.append('circle').attr('cx', x(pt.p)).attr('cy', y(pt.v))
          .attr('r', isPrimary ? 3 : 2).attr('fill', col).attr('data-brand', b)
          .attr('r', 0).transition().duration(400).delay(500).ease(d3.easeBackOut)
          .attr('r', isPrimary ? 3 : 2);
      });

      // right-margin label with collision detection
      const lastPt = vals[vals.length - 1];
      if (lastPt.v != null) {
        let labelY = y(lastPt.v) + 4;
        placedY.forEach(py => { if (Math.abs(py - labelY) < 12) labelY = py + 12; });
        placedY.push(labelY);
        g.append('text').attr('x', iW + 6).attr('y', labelY)
          .attr('text-anchor', 'start').attr('dominant-baseline', 'auto')
          .style('font-size', '9px').style('font-family', FONT_LIGHT)
          .style('fill', col).style('text-transform', 'uppercase')
          .text(b.slice(0, 4))
          .attr('opacity', 0).transition().duration(300).delay(500).attr('opacity', 1);
      }
    });

    g.append('g').attr('transform', 'translate(0,' + iH + ')')
      .call(d3.axisBottom(x).tickSize(0).tickPadding(6))
      .call(ax => ax.select('.domain').remove())
      .selectAll('text').style('fill', '#808080').style('font-size', '9px')
      .style('font-family', FONT_LIGHT).style('text-transform', 'uppercase');

    g.append('g')
      .call(d3.axisLeft(y).ticks(3).tickSize(-iW)
        .tickFormat(d3.format('+.0%')))
      .call(ax => ax.select('.domain').remove())
      .call(ax => ax.selectAll('.tick line').attr('stroke', '#4D4D4D').attr('opacity', 0.35)
        .attr('stroke-dasharray', '2,3'))
      .selectAll('text').style('fill', '#808080').style('font-size', '9px')
      .style('font-family', FONT_LIGHT);

    el.appendChild(svgEl);
  }

  // ─── SLOPE CHART ──────────────────────────────────────────────────────────
  function renderSlope(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const mT = 32, mR = 90, mB = 12, mL = 90;
    const iW = W - mL - mR, iH = H - mT - mB;

    const allVals = data.flatMap(d => [d.v1, d.v2]);
    const y = d3.scaleLinear().domain([0, d3.max(allVals) * 1.1]).range([iH, 0]);

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', H);
    const g = d3.select(svgEl).append('g').attr('transform', 'translate(' + mL + ',' + mT + ')');

    // poles
    [[0,'Period 1'],[iW,'Period 2']].forEach(([px, lbl]) => {
      g.append('line').attr('x1',px).attr('x2',px).attr('y1',0).attr('y2',iH)
        .attr('stroke','var(--grey-700)').attr('stroke-width',0.5);
      g.append('text').attr('x',px).attr('y',-10).attr('text-anchor','middle')
        .style('font-size','9px').style('font-family',FONT_LIGHT)
        .style('text-transform','uppercase').style('fill','var(--grey-300)').text(lbl);
    });

    const sorted = sortWithPrimaryLast(data, primary);

    // collision helper
    function placeLabel(placed, yVal) {
      let ly = yVal;
      placed.forEach(py => { if (Math.abs(py - ly) < 11) ly = py + 11; });
      placed.push(ly);
      return ly;
    }

    const leftPlaced = [], rightPlaced = [];

    sorted.forEach(d => {
      const isPrimary = d.name === primary;
      const col = isPrimary ? D.lineP.color : D.lineC.color;
      const sw  = isPrimary ? D.lineP.width : D.lineC.width;
      const r   = isPrimary ? 5 : 4;

      const x1 = 0, x2 = iW, y1 = y(d.v1), y2 = y(d.v2);

      // line (enter from left)
      const ln = g.append('line').attr('x1',x1).attr('y1',y1).attr('x2',x1).attr('y2',y1)
        .attr('stroke',col).attr('stroke-width',sw).attr('data-brand',d.name);
      ln.transition().duration(600).ease(d3.easeCubicOut).attr('x2',x2).attr('y2',y2);

      // dots
      [[x1,y1],[x2,y2]].forEach(([cx,cy]) => {
        g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',0)
          .attr('fill',col).attr('data-brand',d.name)
          .transition().duration(400).delay(300).ease(d3.easeBackOut).attr('r',r);
      });

      // left label
      const ly1 = placeLabel(leftPlaced, y1);
      g.append('text').attr('x',-9).attr('y',ly1+4).attr('text-anchor','end')
        .style('font-size', isPrimary ? '10px':'8.5px').style('font-family',FONT_LIGHT)
        .style('fill',col).text(d.name.slice(0,4).toUpperCase() + ' ' + d.v1.toFixed(2))
        .attr('opacity',0).transition().duration(300).delay(400).attr('opacity',1);

      // right label
      const ly2 = placeLabel(rightPlaced, y2);
      g.append('text').attr('x',iW+9).attr('y',ly2+4).attr('text-anchor','start')
        .style('font-size', isPrimary ? '10px':'8.5px').style('font-family',FONT_LIGHT)
        .style('fill',col).text(d.name.slice(0,4).toUpperCase() + ' ' + d.v2.toFixed(2))
        .attr('opacity',0).transition().duration(300).delay(400).attr('opacity',1);
    });

    el.appendChild(svgEl);
  }

  // ─── STACKED 100% AREA ───────────────────────────────────────────────────
  function renderArea100(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const mT = 10, mR = 52, mB = 28, mL = 32;
    const iW = W - mL - mR, iH = H - mT - mB;

    const brands = Object.keys(data[0]).filter(k => k !== 'period');
    const brandOrder = [
      ...[...brands.filter(b => b !== primary)].sort((a,b) =>
        d3.mean(data, d => d[b] || 0) - d3.mean(data, d => d[a] || 0)),
      primary,
    ];

    const stack = d3.stack().keys(brandOrder).offset(d3.stackOffsetExpand);
    const series = stack(data);

    const x = d3.scalePoint().domain(data.map(d => d.period)).range([0, iW]).padding(0.1);
    const y = d3.scaleLinear().domain([0, 1]).range([iH, 0]);
    const area = d3.area()
      .x(d => x(d.data.period)).y0(d => y(d[0])).y1(d => y(d[1]))
      .curve(d3.curveMonotoneX);

    const opacities = [0.75, 0.60, 0.45, 0.32];
    const compBrands = brandOrder.filter(b => b !== primary);

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', H);
    const g = d3.select(svgEl).append('g').attr('transform', 'translate(' + mL + ',' + mT + ')');

    series.forEach((s, i) => {
      const isPrimary = s.key === primary;
      const compRank = compBrands.indexOf(s.key);
      const fillOp = isPrimary ? 0.78 : (opacities[compRank] || 0.25);
      g.append('path').datum(s)
        .attr('fill', isPrimary ? D.primary : D.comp)
        .attr('fill-opacity', fillOp)
        .attr('stroke', '#1A1A1A').attr('stroke-width', 0.5)
        .attr('data-brand', s.key)
        .attr('d', area)
        .style('cursor', 'pointer');
    });

    // inline labels (rightmost point)
    const placedY = [];
    [...brandOrder].reverse().forEach(b => {
      const lastRow = series.find(s => s.key === b);
      if (!lastRow) return;
      const last = lastRow[lastRow.length - 1];
      const midY = y((last[0] + last[1]) / 2);
      if ((last[1] - last[0]) < 0.04) return;
      let ly = midY;
      placedY.forEach(py => { if (Math.abs(py - ly) < 12) ly = py + 12; });
      placedY.push(ly);
      g.append('text').attr('x', iW + 5).attr('y', ly + 4)
        .attr('text-anchor', 'start')
        .style('font-size', '9px').style('font-family', FONT_LIGHT)
        .style('fill', b === primary ? D.primary : D.comp)
        .style('text-transform', 'uppercase').text(b.slice(0, 4));
    });

    // axes
    g.append('g').attr('transform', 'translate(0,' + iH + ')')
      .call(d3.axisBottom(x).tickSize(0).tickPadding(6))
      .call(ax => ax.select('.domain').remove())
      .selectAll('text').style('fill','#808080').style('font-size','9px')
      .style('font-family', FONT_LIGHT).style('text-transform','uppercase');

    g.append('g')
      .call(d3.axisLeft(y).ticks(3).tickSize(-iW).tickFormat(d3.format('.0%')))
      .call(ax => ax.select('.domain').remove())
      .call(ax => ax.selectAll('.tick line').attr('stroke','#4D4D4D').attr('opacity',0.35)
        .attr('stroke-dasharray','2,3'))
      .selectAll('text').style('fill','#808080').style('font-size','9px')
      .style('font-family', FONT_LIGHT);

    el.appendChild(svgEl);
  }

  // ─── STREAM GRAPH ─────────────────────────────────────────────────────────
  function renderStream(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const mT = 10, mR = 16, mB = 28, mL = 16;
    const iW = W - mL - mR, iH = H - mT - mB;

    const brands = Object.keys(data[0]).filter(k => k !== 'period');
    const brandOrder = [
      ...[...brands.filter(b => b !== primary)].sort((a,b) =>
        d3.mean(data, d => d[b] || 0) - d3.mean(data, d => d[a] || 0)),
      primary,
    ];

    const stack = d3.stack().keys(brandOrder).offset(d3.stackOffsetSilhouette);
    const series = stack(data);

    const x = d3.scalePoint().domain(data.map(d => d.period)).range([0, iW]).padding(0.1);
    const allY = series.flatMap(s => s.flatMap(d => [d[0], d[1]]));
    const y = d3.scaleLinear().domain([d3.min(allY), d3.max(allY)]).range([iH, 0]);

    const area = d3.area()
      .x(d => x(d.data.period)).y0(d => y(d[0])).y1(d => y(d[1]))
      .curve(d3.curveBasis);

    const opacities = [0.75, 0.60, 0.45, 0.32];
    const compBrands = brandOrder.filter(b => b !== primary);

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', H);
    const g = d3.select(svgEl).append('g').attr('transform', 'translate(' + mL + ',' + mT + ')');

    series.forEach((s, i) => {
      const isPrimary = s.key === primary;
      const compRank = compBrands.indexOf(s.key);
      const fillOp = isPrimary ? 0.78 : (opacities[compRank] || 0.25);
      g.append('path').datum(s)
        .attr('fill', isPrimary ? D.primary : D.comp)
        .attr('fill-opacity', 0)
        .attr('data-brand', s.key)
        .attr('d', area)
        .transition().duration(600).delay(i * 80).ease(d3.easeCubicOut)
        .attr('fill-opacity', fillOp);
    });

    // mid-band labels
    const midIdx = Math.floor(data.length / 2);
    series.forEach(s => {
      const mid = s[midIdx];
      const bandH = Math.abs(y(mid[0]) - y(mid[1]));
      if (bandH < 20) return;
      const cy = y((mid[0] + mid[1]) / 2);
      g.append('text').attr('x', x(data[midIdx].period)).attr('y', cy + 4)
        .attr('text-anchor', 'middle')
        .style('font-size', '9px').style('font-family', FONT_LIGHT)
        .style('fill', '#1A1A1A').text(s.key.slice(0, 4).toUpperCase());
    });

    g.append('g').attr('transform', 'translate(0,' + iH + ')')
      .call(d3.axisBottom(x).tickSize(0).tickPadding(6))
      .call(ax => ax.select('.domain').remove())
      .selectAll('text').style('fill','#808080').style('font-size','9px')
      .style('font-family', FONT_LIGHT).style('text-transform','uppercase');

    el.appendChild(svgEl);
  }

  // ─── TREEMAP ──────────────────────────────────────────────────────────────
  function renderTreemap(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', H);
    const svg = d3.select(svgEl);

    const root = d3.hierarchy({ children: data }).sum(d => d.value);
    d3.treemap().size([W, H]).padding(2).round(true)(root);

    const nodes = root.leaves();
    const sorted = [...nodes].sort((a,b) => b.value - a.value);

    sorted.forEach((node, i) => {
      const isPrimary = node.data.name === primary;
      const cellW = node.x1 - node.x0, cellH = node.y1 - node.y0;

      const cell = svg.append('g').attr('transform', 'translate(' + node.x0 + ',' + node.y0 + ')');

      cell.append('rect').attr('width', cellW).attr('height', cellH)
        .attr('fill', isPrimary ? D.primary : D.comp)
        .attr('fill-opacity', isPrimary ? 1 : 0.72)
        .attr('data-brand', node.data.name)
        .style('cursor', 'pointer')
        .attr('transform-origin', (cellW/2) + 'px ' + (cellH/2) + 'px')
        .attr('transform', 'scale(0)')
        .transition().duration(500).delay(i * 30).ease(d3.easeCubicOut)
        .attr('transform', 'scale(1)');

      if (cellW > 40 && cellH > 20) {
        cell.append('text').attr('x', 5).attr('y', 14)
          .style('font-size', Math.min(11, cellW * 0.22) + 'px')
          .style('font-family', FONT_LIGHT).style('text-transform', 'uppercase')
          .style('fill', '#1A1A1A').text(node.data.name.slice(0, 4));
      }
      if (cellW > 40 && cellH > 30) {
        cell.append('text').attr('x', 5).attr('y', 26)
          .style('font-size', Math.min(10, cellW * 0.20) + 'px')
          .style('font-family', FONT_TITLE).style('font-style', 'italic')
          .style('fill', '#1A1A1A').text(node.data.value.toFixed(1));
      }
    });

    el.appendChild(svgEl);
  }

  // ─── TREEMAP BAR ──────────────────────────────────────────────────────────
  function renderTreemapBar(el, data, primary, D) {
    const W = el.offsetWidth || 500;
    if (!data || !data.length) { showEmpty(el); return; }

    const H = 72, gap = 3;
    const sorted = [...data].sort((a,b) => b.value - a.value);
    const total = d3.sum(sorted, d => d.value);
    const usableW = W - gap * (sorted.length - 1);
    const opacities = [1.0, 0.82, 0.65, 0.50, 0.38];
    const compBrands = sorted.filter(d => d.name !== primary);

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', H);
    const svg = d3.select(svgEl);

    let cx = 0;
    sorted.forEach((d, i) => {
      const isPrimary = d.name === primary;
      const segW = (d.value / total) * usableW;
      const compRank = compBrands.findIndex(c => c.name === d.name);
      const op = isPrimary ? 1 : (opacities[compRank] || 0.25);

      const rxL = i === 0 ? 4 : 0;
      const rxR = i === sorted.length - 1 ? 4 : 0;

      // draw rect with clip for rounded corners only on outer edges
      svg.append('rect')
        .attr('x', cx).attr('y', 0).attr('width', 0).attr('height', H)
        .attr('rx', (rxL || rxR) ? 4 : 0)
        .attr('fill', isPrimary ? D.primary : D.comp)
        .attr('fill-opacity', op)
        .attr('data-brand', d.name)
        .transition().duration(600).ease(d3.easeCubicOut).attr('width', segW);

      if (segW > 44) {
        const lx = cx + segW / 2;
        svg.append('text').attr('x', lx).attr('y', H/2 - 5)
          .attr('text-anchor', 'middle')
          .style('font-size', Math.min(11, segW * 0.20) + 'px')
          .style('font-family', FONT_LIGHT).style('text-transform', 'uppercase')
          .style('fill', '#1A1A1A').text(d.name.slice(0, 4));
        svg.append('text').attr('x', lx).attr('y', H/2 + 9)
          .attr('text-anchor', 'middle')
          .style('font-size', Math.min(12, segW * 0.20) + 'px')
          .style('font-family', FONT_TITLE).style('font-style', 'italic')
          .style('fill', '#1A1A1A').text(d.value.toFixed(1));
      }

      cx += segW + gap;
    });

    el.style.display = 'flex';
    el.style.alignItems = 'center';
    el.appendChild(svgEl);
  }

  // ─── BUBBLES ──────────────────────────────────────────────────────────────
  function renderBubbles(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', H);
    const svg = d3.select(svgEl);

    const pack = d3.pack().size([W, H]).padding(4);
    const root = d3.hierarchy({ children: sortWithPrimaryLast(data, primary) }).sum(d => d.value);
    const nodes = pack(root).leaves();

    nodes.forEach((node, i) => {
      const isPrimary = node.data.name === primary;
      const g = svg.append('g').attr('transform', 'translate(' + node.x + ',' + node.y + ')');

      g.append('circle').attr('r', 0)
        .attr('fill', isPrimary ? D.primary : D.comp)
        .attr('fill-opacity', isPrimary ? 1 : 0.72)
        .attr('data-brand', node.data.name)
        .style('cursor', 'pointer')
        .transition().duration(400).delay(i * 40).ease(d3.easeBackOut)
        .attr('r', node.r);

      if (node.r > 14) {
        g.append('text').attr('y', node.r > 24 ? -4 : 4)
          .attr('text-anchor', 'middle')
          .style('font-size', Math.min(11, node.r * 0.32) + 'px')
          .style('font-family', FONT_LIGHT).style('text-transform', 'uppercase')
          .style('fill', '#1A1A1A').style('pointer-events', 'none')
          .text(node.data.name.slice(0, 4));
      }
      if (node.r > 24) {
        g.append('text').attr('y', 10)
          .attr('text-anchor', 'middle')
          .style('font-size', Math.min(10, node.r * 0.26) + 'px')
          .style('font-family', FONT_TITLE).style('font-style', 'italic')
          .style('fill', '#1A1A1A').style('pointer-events', 'none')
          .text(node.data.value.toFixed(1));
      }
    });

    el.appendChild(svgEl);
  }

  // ─── INSET BUBBLE ─────────────────────────────────────────────────────────
  function renderInsetBubble(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const reference = 100;
    const sorted = [
      ...data.filter(d => d.name === primary),
      ...[...data.filter(d => d.name !== primary)].sort((a,b) => b.value - a.value),
    ];
    const n = sorted.length;
    const slotW = W / n;
    const R = Math.min(54, slotW / 2 - 10);
    const cy = R + 16;
    const svgH = R * 2 + 54;

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', svgH);
    const svg = d3.select(svgEl);

    // reference label
    svg.append('text').attr('x', W - 2).attr('y', 13).attr('text-anchor', 'end')
      .style('font-size','8px').style('font-family', FONT_LIGHT).style('fill','var(--grey-700)')
      .text('○ = ' + reference + '%');

    sorted.forEach((d, i) => {
      const isPrimary = d.name === primary;
      const cx = slotW * i + slotW / 2;
      const rInner = Math.max(R * Math.sqrt(d.value / reference), 2.5);
      const col = isPrimary ? D.primary : D.comp;

      // outer circle
      svg.append('circle').attr('cx', cx).attr('cy', cy).attr('r', R)
        .attr('fill', 'none').attr('stroke','var(--grey-700)').attr('stroke-width', 1)
        .attr('data-brand', d.name);

      // inner circle (enter)
      svg.append('circle').attr('cx', cx).attr('cy', cy).attr('r', 0)
        .attr('fill', col).attr('fill-opacity', isPrimary ? 1 : 0.78)
        .attr('data-brand', d.name).style('cursor', 'pointer')
        .transition().duration(400).delay(i * 40).ease(d3.easeBackOut).attr('r', rInner);

      // value label
      if (rInner >= 10) {
        svg.append('text').attr('x', cx).attr('y', cy + 4)
          .attr('text-anchor', 'middle')
          .style('font-size', Math.min(12, rInner * 0.38) + 'px')
          .style('font-family', FONT_TITLE).style('font-style', 'italic')
          .style('fill', '#1A1A1A').text(d.value.toFixed(1));
      } else {
        svg.append('line')
          .attr('x1', cx).attr('y1', cy - rInner - 2).attr('x2', cx).attr('y2', cy - R - 10)
          .attr('stroke', col).attr('stroke-width', 0.8)
          .attr('stroke-dasharray','2,2').attr('opacity', 0.65);
        svg.append('text').attr('x', cx).attr('y', cy - R - 13)
          .attr('text-anchor', 'middle')
          .style('font-size','9.5px').style('font-family', FONT_TITLE).style('font-style','italic')
          .style('fill', col).attr('data-brand', d.name).text(d.value.toFixed(1));
      }

      // brand label below
      svg.append('text').attr('x', cx).attr('y', cy + R + 16)
        .attr('text-anchor', 'middle')
        .style('font-size', isPrimary ? '10px' : '9px').style('font-family', FONT_LIGHT)
        .style('text-transform', 'uppercase').style('fill', col).attr('data-brand', d.name)
        .text(d.name.slice(0, 4));
    });

    el.style.overflow = 'hidden';
    el.appendChild(svgEl);
  }

  // ─── PROGRESS RING ────────────────────────────────────────────────────────
  function renderProgressRing(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const reference = 100;
    const sorted = [
      ...data.filter(d => d.name === primary),
      ...[...data.filter(d => d.name !== primary)].sort((a,b) => b.value - a.value),
    ];
    const n = sorted.length;
    const slotW = W / n;
    const R = Math.min(52, slotW / 2 - 10);
    const sw = Math.max(8, R * 0.22);
    const cy = R + 14;
    const svgH = R * 2 + 50;

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', svgH);
    const svg = d3.select(svgEl);

    const arcTrack = d3.arc().innerRadius(R - sw).outerRadius(R)
      .startAngle(-Math.PI).endAngle(Math.PI);
    const arcFill = d3.arc().innerRadius(R - sw).outerRadius(R).cornerRadius(sw / 2);

    sorted.forEach((d, i) => {
      const isPrimary = d.name === primary;
      const cx = slotW * i + slotW / 2;
      const col = isPrimary ? D.primary : D.comp;
      const endAngle = -Math.PI / 2 + (d.value / reference) * 2 * Math.PI;

      const g = svg.append('g').attr('transform', 'translate(' + cx + ',' + cy + ')');

      // track
      g.append('path').attr('d', arcTrack()).attr('fill','var(--grey-700)').attr('opacity', 0.30);

      // fill via attrTween
      const fillPath = g.append('path')
        .attr('fill', col).attr('fill-opacity', isPrimary ? 1 : 0.80)
        .attr('data-brand', d.name).style('cursor','pointer');
      fillPath.transition().duration(700).ease(d3.easeCircleOut)
        .attrTween('d', () => {
          const interp = d3.interpolate(-Math.PI / 2, endAngle);
          return t => arcFill.startAngle(-Math.PI / 2).endAngle(interp(t))();
        });

      // value label
      g.append('text').attr('y', 4).attr('text-anchor', 'middle')
        .style('font-size', Math.min(13, R * 0.28) + 'px')
        .style('font-family', FONT_TITLE).style('font-style','italic')
        .style('fill', col).text(d.value.toFixed(1));

      // brand label
      svg.append('text').attr('x', cx).attr('y', cy + R + 16)
        .attr('text-anchor', 'middle')
        .style('font-size', isPrimary ? '10px' : '9px').style('font-family', FONT_LIGHT)
        .style('text-transform','uppercase').style('fill', col).attr('data-brand', d.name)
        .text(d.name.slice(0, 4));
    });

    el.style.overflow = 'hidden';
    el.appendChild(svgEl);
  }

  // ─── WAFFLE CHART ─────────────────────────────────────────────────────────
  function renderWaffle(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const step = 8, r = 3, cols = 10, rows = 10;
    const blockW = cols * step - 2, blockH = rows * step - 2;
    const svgH = blockH + 22;

    const sorted = [
      ...data.filter(d => d.name === primary),
      ...[...data.filter(d => d.name !== primary)].sort((a,b) => b.promoterFraction - a.promoterFraction),
    ];
    const n = sorted.length;
    const brandGap = Math.max(10, (W - n * blockW) / Math.max(n - 1, 1));

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', svgH);
    const svg = d3.select(svgEl);

    sorted.forEach((d, bi) => {
      const isPrimary = d.name === primary;
      const bx = bi * (blockW + brandGap);
      const nPromote = Math.round((d.promoterFraction || 0) * 100);
      const nPassive = Math.round((d.passiveFraction || 0) * 100);
      const col = isPrimary ? D.filled : D.comp;

      const g = svg.append('g').attr('opacity', 0);
      g.transition().duration(500).delay(bi * 80).ease(d3.easeCubicOut).attr('opacity', 1);

      for (let i = 0; i < 100; i++) {
        const c = i % cols, rw = Math.floor(i / cols);
        const cx = bx + c * step + r;
        const cy = rw * step + r;
        let fill, op;
        if (i < nPromote) { fill = col; op = isPrimary ? 1 : 0.78; }
        else if (i < nPromote + nPassive) { fill = D.passive; op = 0.50; }
        else { fill = D.neg; op = 0.85; }
        g.append('circle').attr('cx', cx).attr('cy', cy).attr('r', r)
          .attr('fill', fill).attr('opacity', op);
      }

      // brand label
      svg.append('text').attr('x', bx + blockW / 2).attr('y', blockH + 16)
        .attr('text-anchor', 'middle')
        .style('font-size', isPrimary ? '10px' : '9px').style('font-family', FONT_LIGHT)
        .style('text-transform','uppercase').style('fill', col).attr('data-brand', d.name)
        .text(d.name.slice(0, 4));
    });

    el.style.overflow = 'hidden';
    el.appendChild(svgEl);
  }

  // ─── HORIZONTAL BAR ───────────────────────────────────────────────────────
  function renderHBar(el, data, primary, dashboard, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const mT = 12, mR = 52, mB = 8, mL = 88;
    const iW = W - mL - mR, iH = H - mT - mB;

    // primary forced to top; others sorted desc
    const sorted = [
      ...data.filter(d => d.name === primary),
      ...[...data.filter(d => d.name !== primary)].sort((a,b) => b.value - a.value),
    ];

    const band = d3.scaleBand().domain(sorted.map(d => d.name)).range([0, iH]).padding(0.25);
    const bandwidth = Math.min(band.bandwidth(), 32);
    const x = d3.scaleLinear().domain([0, d3.max(sorted, d => d.value) * 1.1]).range([0, iW]);

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', H);
    const g = d3.select(svgEl).append('g').attr('transform', 'translate(' + mL + ',' + mT + ')');

    // x-axis gridlines
    g.append('g').attr('transform', 'translate(0,' + iH + ')')
      .call(d3.axisBottom(x).ticks(4).tickSize(-iH))
      .call(ax => ax.select('.domain').remove())
      .call(ax => ax.selectAll('.tick line').attr('stroke','#4D4D4D').attr('opacity',0.35)
        .attr('stroke-dasharray','2,3'))
      .selectAll('text').style('fill','#808080').style('font-size','9px')
      .style('font-family', FONT_LIGHT);

    // Illy separator rule
    const primaryRow = sorted.findIndex(d => d.name === primary);
    if (primaryRow >= 0 && primaryRow < sorted.length - 1) {
      const sepY = band(sorted[primaryRow].name) + band.bandwidth() + band.step() * 0.13;
      g.append('line').attr('x1', -mL).attr('x2', iW + mR).attr('y1', sepY).attr('y2', sepY)
        .attr('stroke','var(--grey-700)').attr('stroke-width', 0.5);
    }

    sorted.forEach((d, i) => {
      const isPrimary = d.name === primary;
      const col = isPrimary ? D.primary : D.comp;
      const rowY = band(d.name);
      const barY = rowY + (band.bandwidth() - Math.min(bandwidth, 20)) / 2;
      const barH = Math.min(bandwidth, 20);

      // bar
      g.append('rect').attr('x', 0).attr('y', barY).attr('height', barH)
        .attr('width', 0).attr('rx', 2)
        .attr('fill', col).attr('data-brand', d.name).style('cursor','pointer')
        .on('click', async () => { await selectBrand(d.name, dashboard); })
        .transition().duration(600).delay(i * 50).ease(d3.easeCubicOut).attr('width', x(d.value));

      // brand label
      g.append('text').attr('x', -8).attr('y', rowY + band.bandwidth() / 2 + 4)
        .attr('text-anchor','end')
        .style('font-size', isPrimary ? '10px' : '9px').style('font-family', FONT_LIGHT)
        .style('text-transform','uppercase').style('fill', col).text(d.name);

      // value label (fades in after bars)
      g.append('text').attr('x', x(d.value) + 8).attr('y', rowY + band.bandwidth() / 2 + 4)
        .attr('text-anchor','start')
        .style('font-size','11px').style('font-family', FONT_TITLE).style('font-style','italic')
        .style('fill', col).text(d.value.toFixed(2))
        .attr('opacity', 0).transition().duration(300).delay(i * 50 + 600).attr('opacity', 1);
    });

    el.appendChild(svgEl);
  }

  // ─── VERTICAL BAR STACKED ─────────────────────────────────────────────────
  function renderVBarStacked(el, data, primary, D) {
    const W = el.offsetWidth || 500, H = el.offsetHeight || 300;
    if (H < 120) { showTooSmall(el); return; }
    if (!data || !data.length) { showEmpty(el); return; }

    const mT = 10, mR = 8, mB = 26, mL = 30;
    const iW = W - mL - mR, iH = H - mT - mB;

    const sorted = sortWithPrimaryLast(data, primary);
    const band = d3.scaleBand().domain(sorted.map(d => d.name)).range([0, iW]).padding(0.28);
    const y = d3.scaleLinear().domain([0, 1]).range([iH, 0]);

    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('width', W); svgEl.setAttribute('height', H);
    const g = d3.select(svgEl).append('g').attr('transform', 'translate(' + mL + ',' + mT + ')');

    // y-axis
    g.append('g')
      .call(d3.axisLeft(y).ticks(4).tickSize(-iW)
        .tickFormat(d => Math.round(d * 100) + '%'))
      .call(ax => ax.select('.domain').remove())
      .call(ax => ax.selectAll('.tick line').attr('stroke','#4D4D4D').attr('opacity',0.35)
        .attr('stroke-dasharray','2,3'))
      .selectAll('text').style('fill','#808080').style('font-size','9px')
      .style('font-family', FONT_LIGHT);

    sorted.forEach((d, i) => {
      const isPrimary = d.name === primary;
      const delay = isPrimary ? sorted.length * 40 + 80 : i * 40;
      const bx = band(d.name);
      const bw = band.bandwidth();
      const yActive = y(d.active);

      // passive (top portion)
      g.append('rect').attr('x', bx).attr('y', 0).attr('width', bw)
        .attr('height', 0).attr('rx', 0)
